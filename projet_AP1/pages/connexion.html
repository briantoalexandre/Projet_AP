  <script>
    document.addEventListener("DOMContentLoaded", function () {
    
      const formConnexion = document.querySelector('form[action="traitement_connexion.php"]');
    
      formConnexion.addEventListener("submit", function (e) {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
    
        // Condition ADMIN
        if (email === "admin" && password === "admin") {
          e.preventDefault(); // empêche la soumission vers traitement_connexion.php
          window.location.href = "admin.html"; // redirection
        }
      });
    
    });
    </script>
    
  <body>

    <header>

                <i class="fa-solid fa-user"></i>

    <!-- Page Connexion + Modification Compte -->
    <main class="d-flex justify-content-center align-items-center py-5" style="min-height: 70vh;">
      <div class="card shadow p-4" style="width: 100%; max-width: 720px;">

        <!-- Connexion -->
        <h2 class="text-center mb-4">Connexion</h2>

        <form action="traitement_connexion.php" method="post" class="needs-validation" novalidate>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Adresse email</label>
            <input type="email" class="form-control" id="email" name="email" required />
            <div class="invalid-feedback">Veuillez entrer une adresse email valide.</div>
          </div>

          <!-- Mot de passe -->
          <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="password" name="password" required />
            <div class="invalid-feedback">Veuillez entrer votre mot de passe.</div>
          </div>

          <!-- Bouton -->
          <button type="submit" class="btn btn-dark w-100 fw-bold">Se connecter</button>

          <!-- Lien inscription -->
          <p class="mt-3 text-center">
            Pas encore inscrit ?
            <a href="inscription.html" class="text-dark fw-semibold">Créer un compte</a>
          </p>
        </form>

        <hr class="my-4">

        <!-- Modification de compte -->
        <h4 class="text-center mb-3">Modifier mon compte</h4>

        <form action="traitement_modification.php" method="post">

          <!-- Champ caché ID client -->
          <input type="hidden" name="id_client" value="123">

          <!-- Nom -->
          <div class="mb-3">
            <label for="nom" class="form-label">Nom</label>
            <input type="text" class="form-control" id="nom" name="nom" required>
          </div>

          <!-- Prénom -->
          <div class="mb-3">
            <label for="prenom" class="form-label">Prénom</label>
            <input type="text" class="form-control" id="prenom" name="prenom" required>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email_modif" class="form-label">Adresse email</label>
            <input type="email" class="form-control" id="email_modif" name="email" required>
          </div>

          <!-- Mot de passe -->
          <div class="mb-3">
            <label for="password_modif" class="form-label">Nouveau mot de passe</label>
            <input type="password" class="form-control" id="password_modif" name="password" required>
          </div>

          <!-- Bouton -->
          <button type="submit" class="btn btn-outline-dark w-100 fw-bold">
            Mettre à jour
          </button>
        </form>

      </div>
    </main>
